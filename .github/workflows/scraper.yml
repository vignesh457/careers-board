name: Career Page Scraper

on:
  schedule:
    # 05:30 UTC = 11:00 AM IST (India has no daylight saving, always UTC+5:30)
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Uncomment this step if any source in sources.json has
      # "js_rendered": true (also uncomment playwright in requirements.txt first):
      # - name: Install Playwright browser
      #   run: playwright install --with-deps chromium

      - run: python run.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated results
        run: |
          git config user.name "career-scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/data.json
          git commit -m "Update scraped jobs $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
